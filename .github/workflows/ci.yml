name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check src tests scripts

      - name: Ruff format
        run: uv run ruff format --check src tests scripts

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest

      - name: Bandit
        run: uv run bandit -r src -q

      - name: pip-audit
        run: uv run pip-audit

      - name: Binary / data tracking guard
        run: |
          mapfile -t tracked < <(git ls-files)
          uv run python scripts/precommit_binary_guard.py "${tracked[@]}"
          uv run pytest tests/safety/test_git_tracking_ci.py -q
