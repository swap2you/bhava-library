repos:
  - repo: local
    hooks:
      - id: bhava-binary-guard
        name: Bhāva binary and size guard
        entry: python scripts/precommit_binary_guard.py
        language: system
        pass_filenames: true
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: true
      - id: ruff-format
        name: ruff format check
        entry: uv run ruff format --check
        language: system
        types: [python]
        pass_filenames: true
